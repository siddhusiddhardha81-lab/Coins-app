<title>Cash Coins</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0f1115;color:#fff}
.login{display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.card{width:100%;max-width:360px;background:#1a1d24;border-radius:20px;padding:24px;text-align:center;border:1px solid #23262f}
.input{width:100%;padding:14px;border-radius:12px;border:1px solid #2d3748;background:#0f141c;color:#fff;margin-bottom:12px}
.btn{width:100%;padding:13px;border-radius:12px;border:0;background:#f59e0b;color:#000;font-weight:800;cursor:pointer}
.head{display:flex;justify-content:space-between;padding:14px 16px;background:#1a1d24;border-bottom:1px solid #23262f;position:sticky;top:0;z-index:10;align-items:center}
.nav{display:flex;gap:8px;padding:12px 16px;background:#0f1115;position:sticky;top:58px;z-index:9}
.nav button{flex:1;padding:10px;background:#1a1d24;color:#8b8f98;border:1px solid #23262f;border-radius:10px;font-size:12px}
.nav button.active{background:#f59e0b;color:#000;border:0;font-weight:700}
.list{padding:12px 16px 90px}
.ad-item{width:100%;padding:16px;border:1px solid #23262f;display:flex;gap:12px;background:#1a1d24;border-radius:14px;margin-bottom:12px;align-items:center;cursor:pointer}
.ad-icon{width:48px;height:48px;background:#23262f;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px}
.wallet{margin:16px;padding:20px;border-radius:16px;text-align:center;background:#1a1d24;border:1px solid #23262f}
</style>
<script>(function(s){s.dataset.zone='12128255',s.src='https://al5sm.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
<script>(function(s){s.dataset.zone='12128279',s.src='https://n6wxm.com/vignette.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>

<body>

<div id="login" class="login">
<div class="card">
<h2>Cash Coins</h2>
<input id="phone" class="input" placeholder="Mobile - 10 digits" type="tel">
<button class="btn" onclick="doLogin()">Login</button>
</div>
</div>

<div id="app" style="display:none">
<div class="head">
<div style="display:flex;gap:8px;align-items:center"><b>Cash Coins</b><div style="background:#23262f;padding:6px 12px;border-radius:20px;font-size:11px">ID: <span id="id" style="color:#fff;font-weight:700"></span> | 🪙 <span id="c">0</span></div></div>
<button onclick="doLogout()" style="padding:6px 10px;background:#23262f;color:#fff;font-size:10px;border:0;border-radius:8px">Logout</button>
</div>

<div class="nav">
<button id="home" class="active" onclick="showHome()">Ads</button>
<button id="walletBtn" onclick="showWallet()">Wallet</button>
<button id="withdrawBtn" onclick="showWithdraw()">Withdraw</button>
</div>

<div id="homeV"><div id="adList" class="list"></div></div>
<div id="walletV" style="display:none"><div class="wallet"><h2 id="c2">0 Coins</h2><p style="font-size:22px;margin-top:8px">₹<span id="r2">0</span></p><p style="font-size:11px;color:#8b8f98;margin-top:8px">ID: <span id="idW"></span></p></div></div>
<div id="withdrawV" style="display:none;padding:16px"><div style="background:#1a1d24;padding:16px;border-radius:16px;border:1px solid #23262f"><h3 style="margin-bottom:10px">Withdraw - ID: <span id="id3"></span></h3><input id="upi" class="input" placeholder="UPI ID"><input id="amt" class="input" placeholder="Coins - Min 500" type="number"><button class="btn" onclick="doWithdraw()">Withdraw</button><p style="font-size:10px;color:#6b7280;margin-top:10px">Wallet: <span id="wInfo"></span></p></div></div>
</div>

<script>
var WA="917680914460";
var phone=null;var coins=0;
var adCount=20;

function doLogin(){
var v=document.getElementById('phone').value.trim().replace(/\D/g,'').slice(-10);
if(v.length<10){alert('10 digit');return;}
phone=v;
localStorage.setItem('ph',phone);
document.getElementById('login').style.display='none';
document.getElementById('app').style.display='block';
coins=parseInt(localStorage.getItem('coins_'+phone)||'0');
updateCoins();renderAds();
}

function doLogout(){if(confirm('Logout?')){localStorage.removeItem('ph');document.getElementById('login').style.display='flex';document.getElementById('app').style.display='none';}}

function updateCoins(){
document.getElementById('c').textContent=coins;
document.getElementById('c2').textContent=coins+' Coins';
document.getElementById('r2').textContent=Math.floor(coins/10);
document.getElementById('id').textContent=phone;
document.getElementById('idW').textContent=phone;
document.getElementById('id3').textContent=phone;
document.getElementById('wInfo').textContent=coins+' Coins = ₹'+Math.floor(coins/10);
localStorage.setItem('coins_'+phone,coins.toString());
}

function renderAds(){
var c=document.getElementById('adList');c.innerHTML='';
for(var i=0;i<adCount;i++){
var d=document.createElement('div');d.className='ad-item';
d.innerHTML='<div class="ad-icon">📺</div><div style="flex:1"><b>Watch Ad '+(i+1)+'</b><br><span style="font-size:11px;color:#8b8f98">Watch & Earn</span><br><span style="color:#10b981;font-weight:bold;font-size:11px">🪙 30 Coins = ₹3</span></div><div style="background:#f59e0b;color:#000;padding:8px 14px;border-radius:10px;font-size:12px;font-weight:800">WATCH</div>';
(function(idx){
d.onclick=function(){
// Monetag OnClick + Vignette will trigger automatically on any click
coins+=30;
updateCoins();
// Load more ads when scrolled
if(idx>=adCount-2){adCount+=10;renderAds();}
}
})(i);
c.appendChild(d);
}
}

function showHome(){document.getElementById('homeV').style.display='block';document.getElementById('walletV').style.display='none';document.getElementById('withdrawV').style.display='none';document.getElementById('home').className='active';document.getElementById('walletBtn').className='';document.getElementById('withdrawBtn').className='';}
function showWallet(){document.getElementById('homeV').style.display='none';document.getElementById('walletV').style.display='block';document.getElementById('withdrawV').style.display='none';document.getElementById('home').className='';document.getElementById('walletBtn').className='active';document.getElementById('withdrawBtn').className='';}
function showWithdraw(){document.getElementById('homeV').style.display='none';document.getElementById('walletV').style.display='none';document.getElementById('withdrawV').style.display='block';document.getElementById('home').className='';document.getElementById('walletBtn').className='';document.getElementById('withdrawBtn').className='active';}

function doWithdraw(){
var upi=document.getElementById('upi').value.trim();
var amt=parseInt(document.getElementById('amt').value.trim());
if(!upi||!amt){alert('UPI & Coins');return;}
if(amt<500){alert('Min 500 Coins = ₹50');return;}
if(amt>coins){alert('Not enough - You have '+coins);return;}
var rs=Math.floor(amt/10);
var total=coins;
var remain=total-amt;
var msg="*NEW WITHDRAWAL* 💰\n📱 Phone: "+phone+"\n🆔 User ID: "+phone+"\n💳 UPI: "+upi+"\n🪙 WITHDRAW: "+amt+" Coins = ₹"+rs+"\n👛 WALLET TOTAL: "+total+" Coins = ₹"+Math.floor(total/10)+"\n📉 REMAINING: "+remain+" Coins = ₹"+Math.floor(remain/10)+"\n🌐 Website: coins-app-seven.vercel.app\n⏰ Time: "+new Date().toLocaleString()+"\n✅ Send ₹"+rs+" to "+upi;
window.open("https://wa.me/"+WA+"?text="+encodeURIComponent(msg),"_blank");
}

window.onload=function(){
var saved=localStorage.getItem('ph');
if(saved){phone=saved;document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';coins=parseInt(localStorage.getItem('coins_'+phone)||'0');updateCoins();renderAds();}
}
</script>
