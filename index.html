async function login(phone){
 currentPhone=phone.replace(/\D/g,'').slice(-10);
 localStorage.setItem('cashPhone',currentPhone);
 document.getElementById('loginPage').style.display='none';
 document.getElementById('mainApp').style.display='block';
 try{
  const doc=await db.collection('users').doc(currentPhone).get();
  if(doc.exists){ userData=doc.data(); }
  else {
   userData={coins:0,phone:currentPhone,referId:b64(currentPhone),createdAt:firebase.firestore.FieldValue.serverTimestamp()};
   await db.collection('users').doc(currentPhone).set(userData);
   userData.coins=0;
  }
 }catch(e){userData={coins:0,phone:currentPhone,referId:b64(currentPhone)};}
 updateUI(); renderApps();
}

}
